name: Monitor GitHub Pages

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    name: Check live production release
    if: github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the production site
        env:
          PRODUCTION_URL: ${{ vars.PAGES_PRODUCTION_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: node .github/scripts/pages-release.mjs check "$PRODUCTION_URL"
